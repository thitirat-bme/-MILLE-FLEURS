<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันคำสั่งซื้อ — MILLE FLEURS</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อทรีทเม้นท์หมักผม MILLE FLEURS">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">MILLE FLEURS</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="index.html#moods">มู้ดของสูตร</a>
      </nav>
      <button type="button" class="nav-toggle" aria-label="เปิดเมนู" aria-expanded="false">เมนู</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>ยืนยันคำสั่งซื้อ</h1>
          <p>กรอกข้อมูลติดต่อของคุณให้ครบถ้วน ทีมงานจะติดต่อกลับเพื่อยืนยันการจัดส่ง</p>
        </div>

        <form id="orderForm" class="form-card" novalidate>

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" placeholder="รายการสินค้าที่สั่งซื้อ" required>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" placeholder="0" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
            <p class="form-hint">ไม่บังคับกรอก</p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary">ยืนยันสั่งซื้อ</button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div>
        <p class="brand">MILLE FLEURS</p>
        <p>ทรีทเม้นท์หมักผมพรีเมียม เปลี่ยนทุกวันให้เป็นช่วงเวลาฮีลใจสำหรับเส้นผมและจิตใจ</p>
      </div>
      <nav class="footer-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
